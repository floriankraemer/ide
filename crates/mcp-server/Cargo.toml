[package]
name = "mcp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
axum = "0.7"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
