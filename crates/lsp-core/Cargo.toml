[package]
name = "lsp-core"
version = "0.1.0"
edition = "2021"

[dependencies]
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Tests only: the regression guard that every catalog language stays
# visible to the server lookup (issue #20). No normal-graph edge — see
# docs/architecture/decisions/0018-single-source-language-detection.md.
syntax-core = { path = "../syntax-core" }

[[bin]]
name = "stub_server"
path = "src/bin/stub_server.rs"
