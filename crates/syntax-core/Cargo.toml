[package]
name = "syntax-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tree-sitter = "0.26"
tree-sitter-rust = "0.24.2"
tree-sitter-json = "0.24.8"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-java = "0.23.5"
tree-sitter-php = "0.24.2"
# Batch 1 languages. tree-sitter-toml-ng rather than tree-sitter-toml:
# the latter is stuck at 0.20 and pulls in a second tree-sitter runtime,
# whose Language type cannot satisfy this catalog's grammar fn.
tree-sitter-python = "0.25"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25"
tree-sitter-bash = "0.25.1"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"
# Markup tranche (R4d). tree-sitter-md ships two grammars: the block
# grammar and the inline one it injects into its own `(inline)` nodes.
tree-sitter-md = "0.5.3"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25"
tree-sitter-xml = "0.7"
streaming-iterator = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
