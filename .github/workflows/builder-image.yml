# The gates run inside the same Docker images developers use locally
# (docker/Dockerfile, per CLAUDE.md), so CI cannot drift from the dev
# environment. This workflow publishes one stage of that Dockerfile to GHCR
# and hands the caller its image reference; it is a layer-cache hit and takes
# seconds unless docker/Dockerfile actually changed.
name: Builder image

on:
  workflow_call:
    inputs:
      target:
        description: Dockerfile stage to build (linux-builder or lsp-conformance)
        type: string
        default: linux-builder
    outputs:
      image:
        description: Pushed image reference
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference
        id: ref
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/ide-${{ inputs.target }}:${{ hashFiles('docker/Dockerfile') }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ inputs.target }}
          push: true
          tags: ${{ steps.ref.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
