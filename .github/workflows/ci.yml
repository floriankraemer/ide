name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The gates run inside the same linux-builder image developers use locally
  # (docker/Dockerfile, per CLAUDE.md), so CI cannot drift from the dev
  # environment. This job publishes that image to GHCR; it is a layer-cache
  # hit and takes seconds unless docker/Dockerfile actually changed.
  builder-image:
    name: Builder image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference
        id: ref
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/ide-linux-builder:${{ hashFiles('docker/Dockerfile') }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: linux-builder
          push: true
          tags: ${{ steps.ref.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Lint, test, layering
    needs: builder-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.builder-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # ui-shell's build script compiles the Qt Advanced Docking System
      # sources, so the submodule has to be there.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: Swatinem/rust-cache@v2

      # Steps are ordered cheapest-failure-first: the two gates that need no
      # compilation run before clippy and the test suite.
      - name: Format check
        run: cargo fmt --all --check

      # Full parity with the Verification section of docs/architecture/layering.md.
      - name: Layering gate (Qt and tokio must not leak into core crates)
        run: |
          check() {
            if cargo tree -p "$1" -e normal | grep -qi "$2"; then
              echo "::error::$1 depends on $2 — layering violation (docs/architecture/layering.md)"
              exit 1
            fi
          }
          for crate in editor-core project-model app-core pty-core terminal-core \
                       app-config index-core mcp-server lsp-core ai-chat-core \
                       plugin-api icon-theme plugin-host; do
            check "$crate" qt
          done
          for crate in pty-core terminal-core index-core lsp-core; do
            check "$crate" tokio
          done

      - name: File-size gate
        run: scripts/check-file-size.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: xvfb-run -a cargo test --workspace
